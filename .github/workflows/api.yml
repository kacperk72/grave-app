# Pipeline API rodzinnej mapy (Cloudflare Worker + D1, katalog worker/).
#
#   pull request → sprawdzenie typów
#   push na main → migracje bazy D1 + wdrożenie Workera
#
# Wdrożenie potrzebuje dwóch sekretów repozytorium (Settings → Secrets → Actions):
#   CLOUDFLARE_API_TOKEN   token z uprawnieniami „Edit Cloudflare Workers" + „D1: Edit"
#   CLOUDFLARE_ACCOUNT_ID  identyfikator konta (panel Cloudflare → Workers → prawa kolumna)
# Bez nich krok wdrożenia jest pomijany z ostrzeżeniem, a Workera wdraża się ręcznie
# poleceniem `npm run deploy` w worker/.

name: API — CI i wydanie

on:
  pull_request:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/api.yml'
  push:
    branches: [main]
    paths:
      - 'worker/**'
      - '.github/workflows/api.yml'
  workflow_dispatch:

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  check:
    name: Sprawdzenie typów
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm run typecheck

  deploy:
    name: Wydanie Workera
    needs: check
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: production-api
      url: https://grave-app-api.kacper-kubit99.workers.dev
    defaults:
      run:
        working-directory: worker
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Brak sekretów Cloudflare
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: echo "::warning::Pominięto wdrożenie API — dodaj sekrety CLOUDFLARE_API_TOKEN i CLOUDFLARE_ACCOUNT_ID."

      - uses: actions/checkout@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''

      # Najpierw schemat, potem kod — nowa wersja Workera może już używać nowych kolumn.
      # Wrangler pamięta w D1, które migracje zostały nałożone, więc stare się nie powtórzą.
      - name: Migracje bazy D1
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler d1 migrations apply grave-app --remote

      - name: Wdrożenie Workera
        if: env.CLOUDFLARE_API_TOKEN != '' && env.CLOUDFLARE_ACCOUNT_ID != ''
        run: npx wrangler deploy
