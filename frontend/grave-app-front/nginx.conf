server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── API ────────────────────────────────────────────────────────
    # "api" to nazwa serwisu z compose.yaml, rozwiązywana DNS-em Dockera.
    # Uwaga: frontend GraveMap i tak gada głównie bezpośrednio z Supabase
    # w chmurze — ten proxy obsługuje endpointy własnego backendu NestJS.
    location /api/ {
        proxy_pass http://api:3000/api/;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── PWA: pliki, których NIE WOLNO cache'ować ───────────────────
    # To jest cała różnica względem zwykłego SPA. Service worker aktualizuje
    # się tak, że pobiera ngsw.json i porównuje hashe. Jeśli przeglądarka
    # poda mu ten plik z cache, worker uzna że nic się nie zmieniło —
    # i użytkownik zostanie na starej wersji aplikacji NA ZAWSZE,
    # nawet po wdrożeniu nowej. Klasyczna pułapka PWA.
    # `location =` to dopasowanie dokładne i ma pierwszeństwo przed regexem niżej.
    location = /ngsw.json {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /ngsw-worker.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        expires off;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache" always;
        expires off;
    }

    # ── Zasoby z hashem w nazwie ───────────────────────────────────
    # main-ZADBXHXC.js i spółka: przy każdej zmianie treści zmienia się
    # nazwa pliku, więc można je cache'ować agresywnie i bez ryzyka.
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpe?g|gif|svg|ico|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── Routing SPA ────────────────────────────────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/css application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
