<mat-sidenav-container class="app-container">
  <mat-sidenav
    #drawer
    class="app-sidenav"
    mode="over"
    [opened]="isSidenavOpen()"
    (closedStart)="closeSidenav()"
  >
    <app-sidenav (close)="closeSidenav()" />
  </mat-sidenav>

  <mat-sidenav-content class="app-content">
    <app-header (toggleSidenav)="toggleSidenav()" />
    <main class="page-container" [class.edge-to-edge]="isEdgeToEdge()">
      <router-outlet />
    </main>
    <app-bottom-nav />
  </mat-sidenav-content>
</mat-sidenav-container>
