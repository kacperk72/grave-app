<main class="app-main" [class.with-nav]="showNav()">
  <router-outlet />
</main>
@if (showNav()) {
<app-bottom-nav />
}
@if (update.updateReady()) {
<div class="update" role="status">
  <span>Jest nowa wersja aplikacji</span>
  <button type="button" (click)="update.reload()">Odśwież</button>
</div>
}
@if (showPrompt()) {
<app-profile-prompt />
}
